<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader</title>
  <link rel="icon" href="logo.jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-red-50 text-stone-900">
  <main class="mx-auto flex min-h-screen w-full max-w-xl items-center px-4 py-10">
    <section class="w-full rounded-3xl border border-red-100 bg-white p-6 shadow-sm sm:p-8">
      <img src="logo.jpeg" alt="Video downloader logo" class="h-20 w-20 rounded-2xl shadow-md">
      <h1 class="mt-4 text-3xl font-serif">Video downloader</h1>
      <p class="mt-3 rounded-2xl bg-red-50 p-3 text-sm leading-6">Paste a link to a video you made or have permission to save. This page finds a file link. It does not unlock paid or protected videos.</p>

      <form id="form" class="mt-5 space-y-3">
        <label for="url" class="block text-sm font-bold">Video link</label>
        <input id="url" type="url" required placeholder="https://example.com/watch?v=..." class="w-full rounded-xl border border-red-200 px-3 py-3 outline-none ring-emerald-700 focus:ring-2">
        <button id="go" type="submit" class="w-full rounded-xl bg-emerald-700 px-4 py-3 font-bold text-white hover:bg-emerald-800">Find download</button>
      </form>

      <p id="msg" class="mt-4 hidden rounded-2xl p-3 text-sm"></p>
      <section id="result" class="mt-4 hidden rounded-2xl border border-stone-200 p-4">
        <img id="thumb" alt="" class="mb-3 hidden h-40 w-full rounded-xl object-cover">
        <h2 id="title" class="font-serif text-xl"></h2>
        <div id="links" class="mt-3 grid gap-2"></div>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
