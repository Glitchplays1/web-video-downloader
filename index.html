<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Georgia, serif; background: #f4efe6; color: #1d1a16; }
    main { width: min(560px, calc(100% - 32px)); background: #fffdf8; border: 1px solid #e4d8c4; border-radius: 16px; padding: 28px; }
    h1 { margin: 0 0 8px; }
    label { display: block; font-weight: 700; margin: 16px 0 6px; }
    input, button { width: 100%; box-sizing: border-box; font: inherit; border-radius: 10px; }
    input { border: 1px solid #cbbba3; padding: 12px; }
    button { margin-top: 18px; border: 0; padding: 12px; background: #2f6f4e; color: white; cursor: pointer; }
    .note, .error, .ok { border-radius: 10px; padding: 10px 12px; }
    .note { background: #f7f1e6; }
    .error { background: #fde8e4; color: #8a2b1d; }
    .ok { background: #e7f5ec; }
    a { color: #24583e; }
  </style>
</head>
<body>
  <main>
    <h1>Video downloader</h1>
    <p class="note">This page is live. Browsers are blocked from saving most website videos, so YouTube and similar links need the computer app. Direct video file links can be saved here.</p>
    <p id="msg"></p>
    <form id="form">
      <label for="url">Video link</label>
      <input id="url" type="url" required placeholder="https://example.com/video.mp4">
      <button type="submit">Download</button>
    </form>
    <p>Computer app: download this project and double-click <a href="https://github.com/Glitchplays1/web-video-downloader">run.bat</a>, then open http://127.0.0.1:5000</p>
  </main>
  <script>
    const msg = document.getElementById("msg");
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const url = document.getElementById("url").value.trim();
      msg.className = "note";
      msg.textContent = "Checking the link...";
      const direct = /\.(mp4|webm|mkv|mov|m4v)(\?|$)/i.test(url);
      if (!direct) {
        msg.className = "error";
        msg.textContent = "This public page cannot save that kind of link. Open the project on your computer and double-click run.bat, then use http://127.0.0.1:5000";
        return;
      }
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("The file could not be fetched.");
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = url.split("/").pop().split("?")[0] || "video.mp4";
        link.click();
        URL.revokeObjectURL(link.href);
        msg.className = "ok";
        msg.textContent = "Download started.";
      } catch (err) {
        msg.className = "error";
        msg.textContent = "The browser was blocked from saving that file. Use the computer app instead.";
      }
    });
  </script>
</body>
</html>
